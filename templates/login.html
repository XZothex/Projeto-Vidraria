{% extends 'base.html' %}{% block title %}Entrar | Estoque de Vidros{% endblock %}
{% block content %}<div class="row justify-content-center align-items-center login-area"><div class="col-sm-10 col-md-6 col-lg-4">
<div class="card shadow border-0"><div class="card-body p-4 p-md-5"><div class="text-center mb-4">
<div class="display-5">▥</div><h1 class="h4 fw-bold">Controle de Estoque</h1><p class="text-secondary">Acesse sua conta para continuar</p></div>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label" for="username">Usuário</label><input class="form-control" id="username" name="username" autocomplete="username" required autofocus></div>
<div class="mb-4"><label class="form-label" for="senha">Senha</label><input class="form-control" type="password" id="senha" name="senha" autocomplete="current-password" required></div>
<button class="btn btn-primary w-100">Entrar no sistema</button></form></div></div>
<p class="text-center text-secondary small mt-3">Sistema interno de gerenciamento de vidros</p></div></div>{% endblock %}
