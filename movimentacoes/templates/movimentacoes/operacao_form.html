{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">{{ titulo }}</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
          {% for campo in form %}{% include "partials/_campo.html" %}{% endfor %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn {{ classe_botao }}">{{ botao }}</button>
            <a href="{% url 'movimentacoes:lotes' %}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
