<div class="row border-bottom py-2">
  {{ linha.non_field_errors }}
  {% for campo in linha.hidden_fields %}{{ campo }}{{ campo.errors }}{% endfor %}
  {% for campo in linha.visible_fields %}
  <div class="col-sm-6 col-lg-3 mb-2">
    <label class="form-label small" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
    {% for erro in campo.errors %}<div class="text-danger small">{{ erro }}</div>{% endfor %}
  </div>
  {% endfor %}
</div>
